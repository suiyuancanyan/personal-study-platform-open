<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">两端固定弦上有三个波腹｜L = 0.90 m，波速 36 m/s</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">两端固定弦上有三个波腹</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">L = 0.90 m，波速 36 m/s</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="110" y1="485" x2="520" y2="485" stroke="#334d5c" stroke-width="6" stroke-linecap="round" /><path d="M110 485 Q180 235 250 485 Q320 235 390 485 Q455 235 520 485" fill="none" stroke="#4b8f80" stroke-width="6"/><line x1="110" y1="455" x2="110" y2="510" stroke="#c16757" stroke-width="5" stroke-linecap="round" /><line x1="250" y1="455" x2="250" y2="510" stroke="#c16757" stroke-width="5" stroke-linecap="round" /><line x1="390" y1="455" x2="390" y2="510" stroke="#c16757" stroke-width="5" stroke-linecap="round" /><line x1="520" y1="455" x2="520" y2="510" stroke="#c16757" stroke-width="5" stroke-linecap="round" /><text x="160" y="235" font-size="22" fill="#3d796b" >3 个波腹</text><text x="132" y="540" font-size="17" fill="#273d4b" >0</text><text x="232" y="540" font-size="17" fill="#273d4b" >0.30 m</text><text x="370" y="540" font-size="17" fill="#273d4b" >0.60 m</text><text x="483" y="540" font-size="17" fill="#273d4b" >0.90 m</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">数波腹定模态</text><text x="0" y="48" font-size="20" fill="#273d4b">3 个波腹 → n = 3</text><text x="0" y="86" font-size="20" fill="#273d4b">L = nλ/2</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">波长与频率</text><text x="0" y="205" font-size="20" fill="#273d4b">λ = 2L/n = 0.60 m</text><text x="0" y="243" font-size="20" fill="#273d4b">f = v/λ = 60 Hz</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">节点位置</text><text x="0" y="362" font-size="20" fill="#273d4b">x = 0，0.30，0.60，0.90 m</text><text x="0" y="400" font-size="20" fill="#273d4b">相邻节点间距 λ/2</text></g></g></svg>