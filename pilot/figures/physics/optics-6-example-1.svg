<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">单缝第一暗纹与中央亮纹宽度｜λ = 500 nm，a = 0.10 mm，L = 2.0 m</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">单缝第一暗纹与中央亮纹宽度</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">λ = 500 nm，a = 0.10 mm，L = 2.0 m</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="115" y1="250" x2="115" y2="485" stroke="#344e5c" stroke-width="8" stroke-linecap="round" /><line x1="115" y1="345" x2="155" y2="345" stroke="#ffffff" stroke-width="14" stroke-linecap="round" /><line x1="115" y1="390" x2="155" y2="390" stroke="#ffffff" stroke-width="14" stroke-linecap="round" /><text x="82" y="230" font-size="17" fill="#273d4b" >缝 a</text><line x1="160" y1="345" x2="470" y2="270" stroke="#4b8ca3" stroke-width="3" stroke-linecap="round" /><line x1="160" y1="390" x2="470" y2="465" stroke="#b97941" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="220" x2="490" y2="505" stroke="#344e5c" stroke-width="7" stroke-linecap="round" /><line x1="475" y1="300" x2="505" y2="300" stroke="#bb7049" stroke-width="8" stroke-linecap="round" /><line x1="475" y1="430" x2="505" y2="430" stroke="#bb7049" stroke-width="8" stroke-linecap="round" /><line x1="545" y1="300" x2="545" y2="430" stroke="#80617d" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="555" y="372" font-size="20" fill="#755473" >W = 2 cm</text><line x1="200" y1="340" x2="350" y2="303" stroke="#4b8ca3" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><text x="230" y="292" font-size="18" fill="#3d7085" >θ₁</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">第一暗纹条件</text><text x="0" y="48" font-size="20" fill="#273d4b">a sinθ₁ = λ</text><text x="0" y="86" font-size="20" fill="#273d4b">θ₁ ≈ λ/a = 0.005 rad</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">单侧位置</text><text x="0" y="205" font-size="20" fill="#273d4b">y₁ ≈ Lθ₁</text><text x="0" y="243" font-size="20" fill="#273d4b">y₁ = 0.010 m = 1.0 cm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">中央亮纹</text><text x="0" y="362" font-size="20" fill="#273d4b">两侧第一暗纹之间</text><text x="0" y="400" font-size="20" fill="#273d4b">W ≈ 2Lλ/a = 2.0 cm</text></g></g></svg>