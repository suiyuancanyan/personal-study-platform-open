<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">氢原子 n = 3 到 n = 2 的发射谱线｜Eₙ = −13.6/n² eV</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">氢原子 n = 3 到 n = 2 的发射谱线</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">Eₙ = −13.6/n² eV</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="120" y1="450" x2="510" y2="450" stroke="#576f7a" stroke-width="3" stroke-linecap="round" /><line x1="185" y1="410" x2="420" y2="410" stroke="#447f95" stroke-width="6" stroke-linecap="round" /><line x1="185" y1="290" x2="420" y2="290" stroke="#bd7b42" stroke-width="6" stroke-linecap="round" /><line x1="185" y1="230" x2="420" y2="230" stroke="#bd7b42" stroke-width="6" stroke-linecap="round" /><text x="125" y="418" font-size="18" fill="#273d4b" >n=1</text><text x="125" y="298" font-size="18" fill="#273d4b" >n=2</text><text x="125" y="238" font-size="18" fill="#273d4b" >n=3</text><line x1="300" y1="245" x2="300" y2="280" stroke="#658b6e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="315" y="272" font-size="18" fill="#3c735b" >发射 1.89 eV</text><text x="185" y="500" font-size="21" fill="#a84d48" >λ ≈ 656 nm（红光）</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">跃迁能量</text><text x="0" y="48" font-size="20" fill="#273d4b">E₃ = −1.51 eV，E₂ = −3.40 eV</text><text x="0" y="86" font-size="20" fill="#273d4b">发射 ΔE = 1.89 eV</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">光子波长</text><text x="0" y="205" font-size="20" fill="#273d4b">λ = hc/ΔE</text><text x="0" y="243" font-size="20" fill="#273d4b">≈ 1240/1.89 = 656 nm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">谱线位置</text><text x="0" y="362" font-size="20" fill="#273d4b">可见光红色区域</text><text x="0" y="400" font-size="20" fill="#273d4b">能量下降，发射光子</text></g></g></svg>