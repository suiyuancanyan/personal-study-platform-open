<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">弹簧振子｜求周期与最大加速度｜m = 0.50 kg，k = 50 N/m，A = 4 cm</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">弹簧振子</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">求周期与最大加速度 · m = 0.50 kg，k = 50 N/m，A = 4 cm</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="100" y1="330" x2="500" y2="330" stroke="#80939d" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="290" x2="125" y2="370" stroke="#355b6d" stroke-width="6" stroke-linecap="round" /><path d="M125 330 L160 330 L178 305 L202 355 L226 305 L250 355 L274 305 L298 355 L322 305 L346 355 L370 330 L425 330" fill="none" stroke="#b77936" stroke-width="7"/> <rect x="425" y="285" width="75" height="90" rx="10" fill="#d9e8ef" stroke="#285c78" stroke-width="4"/><text x="444" y="335" font-size="28" fill="#273d4b" >m</text><line x1="405" y1="400" x2="520" y2="400" stroke="#3a8a66" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="438" y="432" font-size="20" fill="#3a8a66" >x = +A</text><text x="100" y="225" font-size="23" fill="#b55749" >回复力 ←</text><text x="100" y="470" font-size="20" fill="#273d4b" >x(t)</text><path d="M145 470 C205 390 265 390 325 470 S445 550 505 470" fill="none" stroke="#386f91" stroke-width="5"/><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">系统参数</text><text x="0" y="48" font-size="20" fill="#273d4b">ω = √(k/m) = 10 rad/s</text><text x="0" y="86" font-size="20" fill="#273d4b">T = 2π/ω = 0.628 s</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">回复力与加速度</text><text x="0" y="205" font-size="20" fill="#273d4b">x = +4 cm 时：F 指向左</text><text x="0" y="243" font-size="20" fill="#273d4b">a_max = ω²A = 4.0 m/s²</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">时序关系</text><text x="0" y="362" font-size="20" fill="#273d4b">x(t) = 4 cos(10t) cm</text><text x="0" y="400" font-size="20" fill="#273d4b">a(t) = −100x(t)</text></g></g></svg>