<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">时间膨胀与长度收缩｜v = 0.60c，钟的固有时间 4 s，尺静长 10 m</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">时间膨胀与长度收缩</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">v = 0.60c，钟的固有时间 4 s，尺静长 10 m</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="130" y1="320" x2="475" y2="320" stroke="#566e79" stroke-width="3" stroke-linecap="round" /><line x1="130" y1="400" x2="475" y2="400" stroke="#566e79" stroke-width="3" stroke-linecap="round" /><line x1="130" y1="320" x2="130" y2="400" stroke="#bd7b3f" stroke-width="7" stroke-linecap="round" /><line x1="475" y1="320" x2="475" y2="400" stroke="#bd7b3f" stroke-width="7" stroke-linecap="round" /><line x1="130" y1="365" x2="475" y2="365" stroke="#4c8ba1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="250" y="300" font-size="20" fill="#385d70" >L₀ = 10 m</text><line x1="175" y1="470" x2="430" y2="470" stroke="#548f76" stroke-width="4" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="238" y="510" font-size="20" fill="#3e795f" >L = L₀/γ = 8 m</text><text x="155" y="230" font-size="19" fill="#273d4b" >沿运动方向测长</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">洛伦兹因子</text><text x="0" y="48" font-size="20" fill="#273d4b">γ = 1/√(1−0.60²)</text><text x="0" y="86" font-size="20" fill="#273d4b">γ = 1.25</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">运动钟</text><text x="0" y="205" font-size="20" fill="#273d4b">Δt = γΔτ</text><text x="0" y="243" font-size="20" fill="#273d4b">地面测得 5.0 s</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">沿运动方向的尺</text><text x="0" y="362" font-size="20" fill="#273d4b">L = L₀/γ</text><text x="0" y="400" font-size="20" fill="#273d4b">地面测得 8.0 m</text></g></g></svg>