<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">无限深势阱 n = 3 降到 n = 2｜E₁ = 0.50 eV</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">无限深势阱 n = 3 降到 n = 2</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">E₁ = 0.50 eV</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="130" y1="430" x2="130" y2="255" stroke="#334f5d" stroke-width="8" stroke-linecap="round" /><line x1="130" y1="430" x2="490" y2="430" stroke="#334f5d" stroke-width="8" stroke-linecap="round" /><line x1="490" y1="430" x2="490" y2="255" stroke="#334f5d" stroke-width="8" stroke-linecap="round" /><path d="M130 430 C180 330 240 330 310 430 S430 530 490 430" fill="none" stroke="#4b8ca2" stroke-width="5"/><path d="M130 430 C180 245 240 245 310 430 S430 610 490 430" fill="none" stroke="#c17a40" stroke-width="5"/><line x1="310" y1="245" x2="310" y2="430" stroke="#8e6280" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><text x="160" y="310" font-size="19" fill="#3c7186" >n=2：E₂ = 2.00 eV</text><text x="160" y="220" font-size="19" fill="#9b653a" >n=3：E₃ = 4.50 eV</text><text x="325" y="405" font-size="18" fill="#785674" >节点 L/2</text><text x="180" y="500" font-size="21" fill="#3f775e" >ΔE = 2.50 eV</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">能级按 n² 增长</text><text x="0" y="48" font-size="20" fill="#273d4b">E₃ = 9E₁ = 4.50 eV</text><text x="0" y="86" font-size="20" fill="#273d4b">E₂ = 4E₁ = 2.00 eV</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">释放能量</text><text x="0" y="205" font-size="20" fill="#273d4b">ΔE = E₃ − E₂</text><text x="0" y="243" font-size="20" fill="#273d4b">ΔE = 2.50 eV</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">n = 2 波函数节点</text><text x="0" y="362" font-size="20" fill="#273d4b">ψ₂ ∝ sin(2πx/L)</text><text x="0" y="400" font-size="20" fill="#273d4b">内部节点：x = L/2</text></g></g></svg>