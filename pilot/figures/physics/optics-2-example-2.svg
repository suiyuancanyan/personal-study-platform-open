y2="405" stroke="#c4734b" stroke-width="8" stroke-linecap="round" /><line x1="490" y1="440" x2="515" y2="440" stroke="#7da8bb" stroke-width="8" stroke-linecap="round" /><text x="525" y="280" font-size="18" fill="#a65d3a" >明</text><text x="525" y="375" font-size="18" fill="#486f80" >暗</text><line x1="550" y1="300" x2="550" y2="335" stroke="#8a607e" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="565" y="326" font-size="19" fill="#775169" >1.5 mm</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">相邻明纹间距</text><text x="0" y="48" font-size="20" fill="#273d4b">Δx = λD/d</text><text x="0" y="86" font-size="20" fill="#273d4b">= 3.0 mm</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">第一暗纹条件</text><text x="0" y="205" font-size="20" fill="#273d4b">到中心的程差 = λ/2</text><text x="0" y="243" font-size="20" fill="#273d4b">y₁ = Δx/2 = 1.5 mm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">屏上级次</text><text x="0" y="362" font-size="20" fill="#273d4b">明：0，±3，±6 mm…</text><text x="0" y="400" font-size="20" fill="#273d4b">暗：±1.5，±4.5 mm…</text></g></g></svg>