<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">光电效应的遏止电压｜λ = 400 nm，逸出功 W = 2.0 eV</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">光电效应的遏止电压</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">λ = 400 nm，逸出功 W = 2.0 eV</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="115" y1="260" x2="235" y2="330" stroke="#bd7a3e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="115" y1="345" x2="235" y2="345" stroke="#bd7a3e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="115" y1="430" x2="235" y2="360" stroke="#bd7a3e" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="235" y="255" width="32" height="160" fill="#e4edf0" stroke="#3e7084" stroke-width="4"/><circle cx="310" cy="285" r="8" fill="#9c6b8f"/><line x1="270" y1="285" x2="365" y2="285" stroke="#528b71" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="310" cy="340" r="8" fill="#9c6b8f"/><line x1="270" y1="340" x2="365" y2="340" stroke="#528b71" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="310" cy="395" r="8" fill="#9c6b8f"/><line x1="270" y1="395" x2="365" y2="395" stroke="#528b71" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="395" y1="250" x2="395" y2="430" stroke="#617782" stroke-width="5" stroke-linecap="round" /><line x1="455" y1="250" x2="455" y2="430" stroke="#617782" stroke-width="5" stroke-linecap="round" /><text x="100" y="230" font-size="19" fill="#986332" >光子 3.10 eV</text><text x="280" y="460" font-size="18" fill="#3f7d65" >电子 Kmax = 1.10 eV</text><text x="390" y="230" font-size="19" fill="#765476" >Us = 1.10 V</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">光子能量</text><text x="0" y="48" font-size="20" fill="#273d4b">Eγ = hc/λ</text><text x="0" y="86" font-size="20" fill="#273d4b">≈ 1240/400 = 3.10 eV</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">能量守恒</text><text x="0" y="205" font-size="20" fill="#273d4b">Kmax = Eγ − W</text><text x="0" y="243" font-size="20" fill="#273d4b">= 1.10 eV</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">遏止电压</text><text x="0" y="362" font-size="20" fill="#273d4b">eUs = Kmax</text><text x="0" y="400" font-size="20" fill="#273d4b">Us = 1.10 V</text></g></g></svg>