<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">相对论总能、动能和动量｜v = 0.60c，静能 mc² = 2 MeV</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">相对论总能、动能和动量</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">v = 0.60c，静能 mc² = 2 MeV</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="130" y="250" width="120" height="160" rx="12" fill="#dceaf0" stroke="#3e7185" stroke-width="4"/><rect x="300" y="210" width="120" height="200" rx="12" fill="#e9ded1" stroke="#a56c3d" stroke-width="4"/><rect x="470" y="370" width="70" height="40" rx="8" fill="#dcebe1" stroke="#52836b" stroke-width="4"/><text x="155" y="340" font-size="22" fill="#273d4b" >静能</text><text x="330" y="320" font-size="22" fill="#273d4b" >总能</text><text x="487" y="398" font-size="18" fill="#273d4b" >K</text><text x="135" y="450" font-size="19" fill="#273d4b" >2.00 MeV</text><text x="300" y="450" font-size="19" fill="#273d4b" >2.50 MeV</text><text x="450" y="450" font-size="18" fill="#273d4b" >0.50 MeV</text><text x="180" y="225" font-size="18" fill="#3d7185" >E = γmc²</text><text x="320" y="185" font-size="18" fill="#9b6339" >γ = 1.25</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">洛伦兹因子</text><text x="0" y="48" font-size="20" fill="#273d4b">γ = 1.25</text><text x="0" y="86" font-size="20" fill="#273d4b">β = 0.60</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">能量</text><text x="0" y="205" font-size="20" fill="#273d4b">E = γmc² = 2.50 MeV</text><text x="0" y="243" font-size="20" fill="#273d4b">K = (γ−1)mc² = 0.50 MeV</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">动量与校核</text><text x="0" y="362" font-size="20" fill="#273d4b">pc = γβmc² = 1.50 MeV</text><text x="0" y="400" font-size="20" fill="#273d4b">E² = (pc)² + (mc²)²</text></g></g></svg>