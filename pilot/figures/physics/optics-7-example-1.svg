<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">光栅一级衍射角｜光栅常数 d = 2.0 μm，λ = 0.50 μm</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">光栅一级衍射角</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">光栅常数 d = 2.0 μm，λ = 0.50 μm</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="115" y1="280" x2="115" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><line x1="149" y1="280" x2="149" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><line x1="183" y1="280" x2="183" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><line x1="217" y1="280" x2="217" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><line x1="251" y1="280" x2="251" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><line x1="285" y1="280" x2="285" y2="450" stroke="#344e5c" stroke-width="5" stroke-linecap="round" /><text x="112" y="480" font-size="18" fill="#273d4b" >相邻缝距 d = 2.0 μm</text><line x1="355" y1="365" x2="500" y2="260" stroke="#4c8ba2" stroke-width="4" stroke-linecap="round" /><line x1="355" y1="365" x2="500" y2="365" stroke="#667e89" stroke-width="3" stroke-linecap="round" /><line x1="400" y1="365" x2="460" y2="365" stroke="#bf7a3d" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="415" y="395" font-size="18" fill="#a16634" >d</text><line x1="485" y1="265" x2="485" y2="365" stroke="#98718b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><text x="500" y="320" font-size="20" fill="#795b74" >θ = 14.5°</text><text x="150" y="235" font-size="22" fill="#365e72" >d sinθ = λ</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">相邻缝程差</text><text x="0" y="48" font-size="20" fill="#273d4b">d sinθ = mλ</text><text x="0" y="86" font-size="20" fill="#273d4b">m = 1</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">求衍射角</text><text x="0" y="205" font-size="20" fill="#273d4b">sinθ = 0.50/2.0 = 0.25</text><text x="0" y="243" font-size="20" fill="#273d4b">θ ≈ 14.5°</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">左右对称级次</text><text x="0" y="362" font-size="20" fill="#273d4b">m = +1：+14.5°</text><text x="0" y="400" font-size="20" fill="#273d4b">m = −1：−14.5°</text></g></g></svg>