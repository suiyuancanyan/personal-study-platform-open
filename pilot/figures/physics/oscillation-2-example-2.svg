<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">用初位移和初速度确定振幅与初相｜ω = 4 rad/s，x₀ = 3 cm，v₀ = −16 cm/s</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">用初位移和初速度确定振幅与初相</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">ω = 4 rad/s，x₀ = 3 cm，v₀ = −16 cm/s</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="105" y1="485" x2="510" y2="485" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="540" x2="125" y2="225" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><circle cx="125" cy="485" r="5" fill="#334b57"/><line x1="125" y1="485" x2="365" y2="335" stroke="#d08543" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="125" y1="485" x2="365" y2="485" stroke="#6997ab" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="365" y1="485" x2="365" y2="335" stroke="#6997ab" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><text x="375" y="350" font-size="20" fill="#273d4b" >(x₀, −v₀/ω)</text><text x="90" y="520" font-size="18" fill="#273d4b" >0</text><text x="275" y="520" font-size="18" fill="#273d4b" >3 cm</text><text x="385" y="300" font-size="18" fill="#273d4b" >4 cm</text><text x="240" y="275" font-size="22" fill="#a46327" >A = 5 cm</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">初始状态</text><text x="0" y="48" font-size="20" fill="#273d4b">cos φ = x₀/A</text><text x="0" y="86" font-size="20" fill="#273d4b">v₀ = −Aω sin φ &lt; 0</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">振幅</text><text x="0" y="205" font-size="20" fill="#273d4b">A² = x₀² + (v₀/ω)²</text><text x="0" y="243" font-size="20" fill="#273d4b">A = √(3² + 4²) = 5 cm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">初相象限</text><text x="0" y="362" font-size="20" fill="#273d4b">cos φ = 3/5，sin φ = 4/5</text><text x="0" y="400" font-size="20" fill="#273d4b">φ = atan2(4,3) ≈ 0.927 rad</text></g></g></svg>