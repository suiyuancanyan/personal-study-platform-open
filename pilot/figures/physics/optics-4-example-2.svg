<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">空气劈尖的厚度与条纹｜λ₀ = 600 nm，暗纹间距 0.30 mm；求 α 与 x = 4.5 mm 处厚度</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">空气劈尖的厚度与条纹</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">λ₀ = 600 nm，暗纹间距 0.30 mm；求 α 与 x = 4.5 mm 处厚度</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="100" y1="425" x2="520" y2="425" stroke="#596e79" stroke-width="8" stroke-linecap="round" /><path d="M100 420 L520 300 L520 420 Z" fill="#d9e9ef" stroke="#47768a" stroke-width="2"/><line x1="125" y1="370" x2="490" y2="370" stroke="#4f91a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7"/><line x1="130" y1="445" x2="490" y2="445" stroke="#b77c40" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="250" y="475" font-size="18" fill="#98632e" >条纹间距 b = 0.30 mm</text><line x1="150" y1="420" x2="150" y2="405" stroke="#8d617e" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="165" y="400" font-size="18" fill="#775169" >t = αx</text><text x="110" y="345" font-size="17" fill="#273d4b" >t=0</text><text x="435" y="337" font-size="18" fill="#315f76" >t=4.5 μm</text><text x="485" y="405" font-size="20" fill="#b75e4b" >α</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">条纹间距反推角度</text><text x="0" y="48" font-size="20" fill="#273d4b">b = λ/(2α)</text><text x="0" y="86" font-size="20" fill="#273d4b">α = 0.001 rad</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">沿劈尖线性增厚</text><text x="0" y="205" font-size="20" fill="#273d4b">t(x) ≈ αx</text><text x="0" y="243" font-size="20" fill="#273d4b">t(4.5 mm) = 4.5 μm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">反射条纹标记</text><text x="0" y="362" font-size="20" fill="#273d4b">相邻同类暗纹差 Δt = λ/2</text><text x="0" y="400" font-size="20" fill="#273d4b">等厚线横向间距 b = 0.30 mm</text></g></g></svg>