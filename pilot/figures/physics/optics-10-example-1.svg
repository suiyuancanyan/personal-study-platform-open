<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">空气劈尖更换波长后判断条纹｜500 nm 时 A 为第四条暗纹，棱边距 A 为 1.56 cm</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">空气劈尖更换波长后判断条纹</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">500 nm 时 A 为第四条暗纹，棱边距 A 为 1.56 cm</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="115" y1="430" x2="510" y2="430" stroke="#596e79" stroke-width="8" stroke-linecap="round" /><path d="M115 425 L510 295 L510 425 Z" fill="#d9e9ef" stroke="#47768a" stroke-width="2"/><line x1="145" y1="416" x2="475" y2="310" stroke="#4f91a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9"/><line x1="145" y1="400" x2="475" y2="400" stroke="#bd7850" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 8"/><line x1="145" y1="382" x2="475" y2="382" stroke="#4f91a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9"/><line x1="145" y1="364" x2="475" y2="364" stroke="#bd7850" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 8"/><line x1="145" y1="345" x2="475" y2="345" stroke="#4f91a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 9"/><line x1="145" y1="327" x2="475" y2="327" stroke="#bd7850" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 8"/><line x1="447" y1="430" x2="447" y2="316" stroke="#725676" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><text x="350" y="460" font-size="18" fill="#725676" >棱边至 A：1.56 cm</text><text x="400" y="300" font-size="22" fill="#a35f44" >A</text><text x="105" y="495" font-size="18" fill="#4c7b90" >旧光：A 为第 4 条暗纹</text><text x="105" y="525" font-size="18" fill="#9e673b" >换 600 nm：A 落在第 3 级亮纹</text><text x="105" y="555" font-size="18" fill="#3f765d" >同一区间：3 条亮纹、3 条暗纹</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">由旧波长求膜厚</text><text x="0" y="48" font-size="20" fill="#273d4b">2e + 250 nm = 7×250 nm</text><text x="0" y="86" font-size="20" fill="#273d4b">e = 750 nm</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">劈尖角</text><text x="0" y="205" font-size="20" fill="#273d4b">α ≈ e/l</text><text x="0" y="243" font-size="20" fill="#273d4b">α ≈ 4.81×10⁻⁵ rad</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">改用 600 nm</text><text x="0" y="362" font-size="20" fill="#273d4b">2e + 300 nm = 1800 nm = 3λ</text><text x="0" y="400" font-size="20" fill="#273d4b">A 为第三级亮纹；区间内 3 明、3 暗</text></g></g></svg>