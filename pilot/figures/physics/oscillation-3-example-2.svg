<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">简谐振动的速度方向和能量比例｜A = 10 cm，ω = 5 rad/s，x = 6 cm，向左运动</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">简谐振动的速度方向和能量比例</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">A = 10 cm，ω = 5 rad/s，x = 6 cm，向左运动</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="105" y1="485" x2="510" y2="485" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="540" x2="125" y2="225" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><path d="M145 460 C210 325 260 255 305 245 C365 270 420 350 490 460" fill="none" stroke="#c87b3a" stroke-width="6"/><line x1="145" y1="460" x2="490" y2="460" stroke="#357a67" stroke-width="5" stroke-linecap="round" /><line x1="330" y1="485" x2="330" y2="245" stroke="#8f657f" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/><text x="90" y="220" font-size="20" fill="#273d4b" >能量 E</text><text x="314" y="520" font-size="18" fill="#273d4b" >x = 6 cm</text><text x="157" y="440" font-size="19" fill="#a05e2a" >Eₚ/E = 0.36</text><text x="372" y="448" font-size="19" fill="#28765e" >动能 0.64E</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">位移决定能量比例</text><text x="0" y="48" font-size="20" fill="#273d4b">Eₚ/E = x²/A²</text><text x="0" y="86" font-size="20" fill="#273d4b">= 0.6² = 0.36</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">速度大小</text><text x="0" y="205" font-size="20" fill="#273d4b">|v| = ω√(A²−x²)</text><text x="0" y="243" font-size="20" fill="#273d4b">= 5×0.08 = 0.40 m/s</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">方向判定</text><text x="0" y="362" font-size="20" fill="#273d4b">此刻向左运动</text><text x="0" y="400" font-size="20" fill="#273d4b">v = −0.40 m/s</text></g></g></svg>