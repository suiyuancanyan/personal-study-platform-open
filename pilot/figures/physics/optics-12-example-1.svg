<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">固定屏点的单缝半波带｜P 原为第二暗纹，缝宽减半</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">固定屏点的单缝半波带</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">P 原为第二暗纹，缝宽减半</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="105" y="225" font-size="20" fill="#3a6479" >原缝宽 a</text><text x="365" y="225" font-size="20" fill="#a16a38" >缝宽减半 a/2</text><line x1="205" y1="260" x2="205" y2="470" stroke="#526d78" stroke-width="8" stroke-linecap="round" /><rect x="212" y="270" width="82" height="42" fill="#dcebf0" stroke="#5289a0" stroke-width="2"/><text x="243" y="299" font-size="15" fill="#344d59" >半波带 1</text><rect x="212" y="316" width="82" height="42" fill="#f1e3d1" stroke="#bd7a42" stroke-width="2"/><text x="243" y="345" font-size="15" fill="#344d59" >半波带 2</text><rect x="212" y="362" width="82" height="42" fill="#dcebf0" stroke="#5289a0" stroke-width="2"/><text x="243" y="391" font-size="15" fill="#344d59" >半波带 3</text><rect x="212" y="408" width="82" height="42" fill="#f1e3d1" stroke="#bd7a42" stroke-width="2"/><text x="243" y="437" font-size="15" fill="#344d59" >半波带 4</text><line x1="294" y1="290" x2="330" y2="290" stroke="#517e92" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="294" y1="382" x2="330" y2="382" stroke="#517e92" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="380" y1="315" x2="380" y2="420" stroke="#526d78" stroke-width="8" stroke-linecap="round" /><rect x="387" y="322" width="82" height="44" fill="#dcebf0" stroke="#5289a0" stroke-width="2"/><text x="416" y="350" font-size="15" fill="#344d59" >半波带 1</text><rect x="387" y="370" width="82" height="44" fill="#f1e3d1" stroke="#bd7a42" stroke-width="2"/><text x="416" y="398" font-size="15" fill="#344d59" >半波带 2</text><line x1="469" y1="340" x2="510" y2="340" stroke="#517e92" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="112" y="515" font-size="18" fill="#3c7186" >程差 2λ · 4 带两两抵消</text><text x="365" y="515" font-size="18" fill="#9c6637" >程差 λ · 2 带抵消</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">原缝宽 a</text><text x="0" y="48" font-size="20" fill="#273d4b">a sinθ = 2λ</text><text x="0" y="86" font-size="20" fill="#273d4b">跨越 4 个半波带</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">固定 P，θ 不变</text><text x="0" y="205" font-size="20" fill="#273d4b">缝宽减半，程差也减半</text><text x="0" y="243" font-size="20" fill="#273d4b">a/2 sinθ = λ</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">重新判定级次</text><text x="0" y="362" font-size="20" fill="#273d4b">半波带数 4 → 2</text><text x="0" y="400" font-size="20" fill="#273d4b">第二暗纹 → 第一暗纹</text></g></g></svg>