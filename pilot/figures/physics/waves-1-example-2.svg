<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">从空间快照和时间记录求波速｜波峰在 x = 0.2 m、0.8 m；探头每 0.15 s 见一次峰</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">从空间快照和时间记录求波速</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">波峰在 x = 0.2 m、0.8 m；探头每 0.15 s 见一次峰</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="105" y1="485" x2="510" y2="485" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><line x1="125" y1="540" x2="125" y2="225" stroke="#71848e" stroke-width="3" stroke-linecap="round" /><path d="M135 350 C170 250 205 250 240 350 S310 450 345 350 S415 250 450 350 S485 430 510 350" fill="none" stroke="#357a9b" stroke-width="5"/><line x1="240" y1="420" x2="450" y2="420" stroke="#ba7a3c" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="315" y="455" font-size="19" fill="#a2642d" >λ = 0.60 m</text><line x1="300" y1="260" x2="300" y2="205" stroke="#528468" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="317" y="225" font-size="19" fill="#528468" >传播方向</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">空间快照</text><text x="0" y="48" font-size="20" fill="#273d4b">λ = 0.8 − 0.2 = 0.60 m</text><text x="0" y="86" font-size="20" fill="#273d4b">相邻波峰给出波长</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">固定探头</text><text x="0" y="205" font-size="20" fill="#273d4b">T = 0.15 s</text><text x="0" y="243" font-size="20" fill="#273d4b">f = 1/T = 6.67 Hz</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">传播速度</text><text x="0" y="362" font-size="20" fill="#273d4b">v = λ/T = fλ</text><text x="0" y="400" font-size="20" fill="#273d4b">v = 0.60/0.15 = 4.0 m/s</text></g></g></svg>