<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">牛顿环由半径平方差求曲率半径｜λ = 600 nm；r₈² − r₃² = 3.0 mm²</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">牛顿环由半径平方差求曲率半径</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">λ = 600 nm；r₈² − r₃² = 3.0 mm²</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><circle cx="300" cy="365" r="132" fill="none" stroke="#4f94aa" stroke-width="5"/><circle cx="300" cy="365" r="108" fill="none" stroke="#bd7e40" stroke-width="4"/><circle cx="300" cy="365" r="78" fill="none" stroke="#4f94aa" stroke-width="5"/><circle cx="300" cy="365" r="48" fill="none" stroke="#bd7e40" stroke-width="4"/><circle cx="300" cy="365" r="15" fill="#647b84"/><line x1="300" y1="365" x2="432" y2="365" stroke="#8c5f79" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="440" y="372" font-size="19" fill="#775169" >r₈</text><line x1="300" y1="365" x2="378" y2="365" stroke="#43806c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="383" y="348" font-size="18" fill="#3d775f" >r₃</text><text x="100" y="545" font-size="21" fill="#3e5d6b" >r₈² − r₃² = 5λR = 3.0 mm²</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">暗环关系</text><text x="0" y="48" font-size="20" fill="#273d4b">rₘ² = mλR</text><text x="0" y="86" font-size="20" fill="#273d4b">Δ(r²) = (8−3)λR</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">代入统一单位</text><text x="0" y="205" font-size="20" fill="#273d4b">λ = 0.00060 mm</text><text x="0" y="243" font-size="20" fill="#273d4b">R = 3.0/(5×0.00060) mm</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">结果</text><text x="0" y="362" font-size="20" fill="#273d4b">R = 1000 mm</text><text x="0" y="400" font-size="20" fill="#273d4b">即曲率半径 1.0 m</text></g></g></svg>