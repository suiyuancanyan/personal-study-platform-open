<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">薄膜反射的半波损失｜空气／n = 1.5 薄膜／空气，λ₀ = 600 nm</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">薄膜反射的半波损失</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">空气／n = 1.5 薄膜／空气，λ₀ = 600 nm</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="110" y1="390" x2="500" y2="390" stroke="#758992" stroke-width="7" stroke-linecap="round" /><line x1="110" y1="470" x2="500" y2="470" stroke="#758992" stroke-width="7" stroke-linecap="round" /><path d="M110 390 L500 390 L500 470 L110 470 Z" fill="#dcebf0" opacity="0.9"/><text x="120" y="445" font-size="20" fill="#315a6d" >薄膜 n = 1.5</text><line x1="200" y1="220" x2="310" y2="385" stroke="#bb7740" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="310" y1="385" x2="420" y2="220" stroke="#447f9a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="270" y1="245" x2="190" y2="375" stroke="#a45d50" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="280" y="215" font-size="18" fill="#273d4b" >入射</text><text x="362" y="260" font-size="18" fill="#376f87" >往返光程</text><text x="105" y="520" font-size="19" fill="#7e4d53" >上反射 π；下反射 0 → 相对相变 π</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">两次界面反射</text><text x="0" y="48" font-size="20" fill="#273d4b">上表面：低 n → 高 n，变相 π</text><text x="0" y="86" font-size="20" fill="#273d4b">下表面：高 n → 低 n，不变相</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">相对相位</text><text x="0" y="205" font-size="20" fill="#273d4b">薄膜往返相位 = 4πnd/λ₀</text><text x="0" y="243" font-size="20" fill="#273d4b">另有一次相对 π 相变</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">最小反射加强</text><text x="0" y="362" font-size="20" fill="#273d4b">4πnd/λ₀ + π = 2π</text><text x="0" y="400" font-size="20" fill="#273d4b">d = λ₀/(4n) = 100 nm</text></g></g></svg>