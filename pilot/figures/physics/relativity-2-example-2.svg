<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">同时性的相对性｜Δx = 300 m，S′ 以 0.60c 向 +x 运动</title><desc id="desc">三栏图解，按已知量、关键关系和计算结果说明例题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="context-stroke"/></marker></defs><rect width="1200" height="650" rx="26" fill="#fbfcfa"/><text x="54" y="48" font-size="27" font-weight="700" fill="#253e4b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">同时性的相对性</text><text x="54" y="79" font-size="16" fill="#526d79" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">Δx = 300 m，S′ 以 0.60c 向 +x 运动</text><rect x="45" y="105" width="1110" height="500" rx="20" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><line x1="125" y1="465" x2="500" y2="465" stroke="#526c79" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="520" x2="200" y2="230" stroke="#526c79" stroke-width="3" stroke-linecap="round" /><text x="505" y="470" font-size="19" fill="#273d4b" >x</text><text x="182" y="220" font-size="19" fill="#273d4b" >ct</text><line x1="200" y1="465" x2="455" y2="260" stroke="#b76f48" stroke-width="4" stroke-linecap="round" /><line x1="200" y1="465" x2="265" y2="260" stroke="#4c88a1" stroke-width="4" stroke-linecap="round" /><line x1="200" y1="465" x2="200" y2="260" stroke="#6a9a78" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="265" y1="465" x2="265" y2="420" stroke="#6a9a78" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><circle cx="200" cy="465" r="10" fill="#466f84"/><circle cx="265" cy="465" r="10" fill="#bd7545"/><text x="95" y="500" font-size="17" fill="#273d4b" >event 1</text><text x="270" y="500" font-size="17" fill="#273d4b" >event 2: +300 m</text><text x="335" y="295" font-size="17" fill="#ac6846" >light</text><text x="205" y="285" font-size="17" fill="#588361" >S 同时轴</text><text x="310" y="230" font-size="20" fill="#765779" >S′ 中 Δt′ = −0.75 μs</text><g transform="translate(625,150)"><text x="0" y="0" font-size="20" font-weight="700" fill="#49788b">S 系给定</text><text x="0" y="48" font-size="20" fill="#273d4b">Δt = 0</text><text x="0" y="86" font-size="20" fill="#273d4b">事件 2 位于 +x 方向</text><path d="M0 114 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="157" font-size="20" font-weight="700" fill="#a16d38">洛伦兹变换</text><text x="0" y="205" font-size="20" fill="#273d4b">Δt′ = γ(Δt − vΔx/c²)</text><text x="0" y="243" font-size="20" fill="#273d4b">γ = 1.25</text><path d="M0 271 H475" stroke="#e2e8e8" stroke-width="2"/><text x="0" y="314" font-size="20" font-weight="700" fill="#4b806b">时间间隔</text><text x="0" y="362" font-size="20" fill="#273d4b">Δt′ = −γ(0.60)(300 m)/c</text><text x="0" y="400" font-size="20" fill="#273d4b">Δt′ = −0.75 μs</text></g></g></svg>