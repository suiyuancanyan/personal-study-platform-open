<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760"><rect width="1120" height="760" fill="#f6f8fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#132c4a}.sub{font-size:16px;fill:#49617b}.pt{font-size:18px;font-weight:700;fill:#12304f}.lab{font-size:15px;fill:#29445f}.small{font-size:13px;fill:#48617a}.eq{font-size:20px;font-weight:700;fill:#12304f}.blue{stroke:#1769aa}.orange{stroke:#e1782f}</style><text x="52" y="56" class="title">例题：由极点求因果冲激响应</text><text x="52" y="84" class="sub">H(s)=1/[(s+1)(s+3)]：部分分式的系数由各极点代入求出。</text>
<rect x="42" y="112" width="1036" height="255" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="146" class="pt">分解并求留数</text>
<text x="90" y="190" text-anchor="start" class="eq">H(s) = 1 / [(s+1)(s+3)]</text>
<text x="90" y="245" text-anchor="start" class="eq">= A/(s+1) + B/(s+3)</text>
<text x="590" y="190" text-anchor="start" class="pt">s=−1 → A=1/2</text>
<text x="590" y="245" text-anchor="start" class="pt">s=−3 → B=−1/2</text>
