<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760"><rect width="1120" height="760" fill="#f6f8fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#132c4a}.sub{font-size:16px;fill:#49617b}.pt{font-size:18px;font-weight:700;fill:#12304f}.lab{font-size:15px;fill:#29445f}.small{font-size:13px;fill:#48617a}.eq{font-size:20px;font-weight:700;fill:#12304f}.blue{stroke:#1769aa}.orange{stroke:#e1782f}</style><text x="52" y="56" class="title">例题：从折点读出分段表达式</text><text x="52" y="84" class="sub">x(t) 在 0 到 2 s 从 0 线性升到 4，此后保持不变。</text>
<rect x="42" y="112" width="1036" height="270" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="146" class="pt">波形与关键时间点</text>
<line x1="155" y1="330" x2="1015" y2="330" stroke="#6e8297" stroke-width="2"/>
<line x1="155" y1="330" x2="155" y2="165" stroke="#6e8297" stroke-width="2"/>
<text x="1015" y="356" text-anchor="end" class="small">t (s)</text>
<text x="160" y="153" text-anchor="start" class="small">x(t)</text>
<line x1="155" y1="165" x2="155" y2="330" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 5"/>
<text x="155" y="354" text-anchor="middle" class="small">0</text>
<line x1="585" y1="165" x2="585" y2="330" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 5"/>
<text x="585" y="354" text-anchor="middle" class="small">1</text>
<line x1="1015" y1="165" x2="1015" y2="330" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 5"/>
<text x="1015" y="354" text-anchor="middle" class="small">2</text>
<line x1="155" y1="330" x2="585" y2="330" stroke="#1769aa" stroke-width="4"/>
<polyline points="585,330 1015,165 1015,165" fill="none" stroke="#1769aa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="1015" y1="165" x2="1015" y2="330" stroke="#1769aa" stroke-width="4"/>
<circle cx="155" cy="330" r="6" fill="#e1782f" stroke="#fff" stroke-width="2"/>
<circle cx="1015" cy="165" r="6" fill="#e1782f" stroke="#fff" stroke-width="2"/>
<text x="605" y="245" text-anchor="start" class="eq">斜率 = (4−0)/(2−0) = 2</text>
<text x="1030" y="170" text-anchor="start" class="lab">4</text>
<text x="127" y="336" text-anchor="end" class="small">0</text>
<rect x="42" y="410" width="1036" height="290" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="444" class="pt">按区间写答案</text>
<text x="90" y="485" text-anchor="start" class="lab">t &lt; 0</text>
<text x="325" y="485" text-anchor="start" class="lab">0 ≤ t ≤ 2</text>
<text x="710" y="485" text-anchor="start" class="lab">t &gt; 2</text>
<text x="90" y="540" text-anchor="start" class="eq">x(t)=0</text>
<text x="325" y="540" text-anchor="start" class="eq">x(t)=2t</text>
<text x="710" y="540" text-anchor="start" class="eq">x(t)=4</text>
<line x1="280" y1="455" x2="280" y2="620" stroke="#e3eaf2" stroke-width="1"/>
<line x1="670" y1="455" x2="670" y2="620" stroke="#e3eaf2" stroke-width="1"/>
<text x="90" y="625" text-anchor="start" class="small">区间外仍需说明信号取值。</text>
<text x="730" y="625" text-anchor="start" class="small">t=2 处高度连续，斜率改变。</text>
</svg>