<text x="67" y="350" text-anchor="start" class="small">蓝：x(τ)    橙：h(t−τ)</text>
<text x="402" y="350" text-anchor="start" class="eq">y(t)=1</text>
<rect x="570" y="112" width="508" height="265" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="592" y="146" class="pt">t=3：重叠区间 [1,2]</text>
