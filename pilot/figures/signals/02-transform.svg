<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760"><rect width="1120" height="760" fill="#f6f8fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#132c4a}.sub{font-size:16px;fill:#49617b}.pt{font-size:18px;font-weight:700;fill:#12304f}.lab{font-size:15px;fill:#29445f}.small{font-size:13px;fill:#48617a}.eq{font-size:20px;font-weight:700;fill:#12304f}.blue{stroke:#1769aa}.orange{stroke:#e1782f}</style><text x="52" y="56" class="title">例题：用原峰值定位变换后的峰</text><text x="52" y="84" class="sub">y(t)=x(2t−4)：令新自变量等于原峰时刻 t=1。</text>
<rect x="42" y="112" width="1036" height="300" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="146" class="pt">原信号 x(τ)：峰值在 τ=1</text>
<line x1="130" y1="350" x2="520" y2="350" stroke="#6e8297" stroke-width="2"/>
<line x1="130" y1="350" x2="130" y2="165" stroke="#6e8297" stroke-width="2"/>
<text x="520" y="376" text-anchor="end" class="small">τ</text>
<text x="135" y="153" text-anchor="start" class="small">x</text>
<polyline points="165,330 250,200 335,330 420,330" fill="none" stroke="#1769aa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="165" y1="330" x2="420" y2="330" stroke="#8194a8" stroke-width="2"/>
<circle cx="250" cy="200" r="6" fill="#e1782f" stroke="#fff" stroke-width="2"/>
<line x1="250" y1="200" x2="250" y2="350" stroke="#d5dee8" stroke-width="1" stroke-dasharray="4 4"/>
<text x="250" y="378" text-anchor="middle" class="small">1</text>
<text x="260" y="190" text-anchor="start" class="small">峰值</text>
<rect x="42" y="444" width="1036" height="256" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="478" class="pt">新时间轴：峰出现在 t=2.5，横向压缩为原来一半</text>
<line x1="130" y1="650" x2="1000" y2="650" stroke="#6e8297" stroke-width="2"/>
<line x1="130" y1="650" x2="130" y2="500" stroke="#6e8297" stroke-width="2"/>
<text x="1000" y="676" text-anchor="end" class="small">t</text>
<text x="135" y="488" text-anchor="start" class="small">y</text>
<polyline points="480,630 565,535 650,630" fill="none" stroke="#e1782f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="565" cy="535" r="6" fill="#e1782f" stroke="#fff" stroke-width="2"/>
<line x1="565" y1="535" x2="565" y2="650" stroke="#f0c49f" stroke-width="1" stroke-dasharray="4 4"/>
<text x="565" y="678" text-anchor="middle" class="small">2.5</text>
<text x="735" y="555" text-anchor="start" class="eq">2t−4=1</text>
<text x="735" y="585" text-anchor="start" class="eq">t=2.5</text>
<text x="735" y="615" text-anchor="start" class="lab">幅度保持不变</text>
</svg>