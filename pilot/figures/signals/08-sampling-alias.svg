<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760"><rect width="1120" height="760" fill="#f6f8fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#132c4a}.sub{font-size:16px;fill:#49617b}.pt{font-size:18px;font-weight:700;fill:#12304f}.lab{font-size:15px;fill:#29445f}.small{font-size:13px;fill:#48617a}.eq{font-size:20px;font-weight:700;fill:#12304f}.blue{stroke:#1769aa}.orange{stroke:#e1782f}</style><text x="52" y="56" class="title">例题：比较 5 kHz 与 8 kHz 采样</text><text x="52" y="84" class="sub">信号限带到 3 kHz；频谱副本间隔等于采样频率，要求 fs &gt; 2B。</text>
<rect x="42" y="112" width="508" height="560" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="64" y="146" class="pt">fs=5 kHz：副本重叠</text>
<line x1="77" y1="455" x2="517" y2="455" stroke="#8194a8" stroke-width="2"/>
<line x1="302" y1="220" x2="302" y2="535" stroke="#6e8297" stroke-width="2"/>
<polyline points="-23,455 52,310 127,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="481" text-anchor="middle" class="small">-10</text>
<polyline points="102,455 177,310 252,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="177" y="481" text-anchor="middle" class="small">-5</text>
<polyline points="227,455 302,310 377,455" fill="none" stroke="#1769aa" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="302" y="481" text-anchor="middle" class="small">0</text>
<polyline points="352,455 427,310 502,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="427" y="481" text-anchor="middle" class="small">5</text>
<polyline points="477,455 552,310 627,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="552" y="481" text-anchor="middle" class="small">10</text>
<text x="77" y="510" text-anchor="start" class="small">频率 (kHz)</text>
<text x="72" y="210" text-anchor="start" class="small">每个三角形代表一份限带频谱副本</text>
<text x="77" y="590" text-anchor="start" class="lab">B = 3 kHz，2B = 6 kHz</text>
<text x="77" y="625" text-anchor="start" class="lab">副本中心间距 = fs</text>
<rect x="570" y="112" width="508" height="560" rx="18" fill="#fff" stroke="#d8e2ee"/><text x="592" y="146" class="pt">fs=8 kHz：副本分开</text>
<line x1="605" y1="455" x2="1045" y2="455" stroke="#8194a8" stroke-width="2"/>
<line x1="830" y1="220" x2="830" y2="535" stroke="#6e8297" stroke-width="2"/>
<polyline points="355,455 430,310 505,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="481" text-anchor="middle" class="small">-16</text>
<polyline points="555,455 630,310 705,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="630" y="481" text-anchor="middle" class="small">-8</text>
<polyline points="755,455 830,310 905,455" fill="none" stroke="#1769aa" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="830" y="481" text-anchor="middle" class="small">0</text>
<polyline points="955,455 1030,310 1105,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1030" y="481" text-anchor="middle" class="small">8</text>
<polyline points="1155,455 1230,310 1305,455" fill="none" stroke="#e1782f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1230" y="481" text-anchor="middle" class="small">16</text>
<text x="605" y="510" text-anchor="start" class="small">频率 (kHz)</text>
<text x="600" y="210" text-anchor="start" class="small">每个三角形代表一份限带频谱副本</text>
<text x="605" y="590" text-anchor="start" class="lab">B = 3 kHz，2B = 6 kHz</text>
<text x="605" y="625" text-anchor="start" class="lab">副本中心间距 = fs</text>
</svg>