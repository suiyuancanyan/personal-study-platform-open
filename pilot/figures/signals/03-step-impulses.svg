<text x="350" y="685" text-anchor="middle" class="lab">+3δ(t−1)</text>
<text x="795" y="685" text-anchor="middle" class="lab">−3δ(t−4)</text>
<text x="500" y="515" text-anchor="middle" class="eq">x′(t)=3δ(t−1)−3δ(t−4)</text>
</svg>