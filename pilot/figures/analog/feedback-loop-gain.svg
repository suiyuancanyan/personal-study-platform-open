<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">A = 100，β = 0.1 的负反馈放大器</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">输出取样后返回输入端；环路增益 T = Aβ = 10，闭环增益由 1 + Aβ 决定</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="80" y="190" width="1235" height="470" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><rect x="300" y="300" width="250" height="125" rx="18" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="425" y="350" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#142d4e">前向放大器</text><text x="425" y="390" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#2764a5">A = 100</text><line x1="160" y1="362" x2="300" y2="362" stroke="#2764a5" stroke-width="4" stroke-linecap="round"/><text x="165" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#66788b">输入</text><text x="245" y="350" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#e77832">Σ</text><line x1="160" y1="362" x2="245" y2="362" stroke="#2764a5" stroke-width="4" stroke-linecap="round"/><line x1="245" y1="362" x2="300" y2="362" stroke="#2764a5" stroke-width="4" stroke-linecap="round"/><line x1="550" y1="362" x2="700" y2="362" stroke="#2764a5" stroke-width="4" stroke-linecap="round"/><circle cx="700" cy="362" r="6" fill="#203247"/><text x="705" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="start" fill="#66788b">输出</text><line x1="700" y1="362" x2="700" y2="520" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="700" y1="520" x2="510" y2="520" stroke="#203247" stroke-width="4" stroke-linecap="round"/><rect x="320" y="485" width="190" height="70" rx="12" fill="#fff4ed" stroke="#f4d1bc" stroke-width="2"/><text x="415" y="530" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#e77832">β = 0.1</text><line x1="320" y1="520" x2="245" y2="520" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="245" y1="520" x2="245" y2="362" stroke="#203247" stroke-width="4" stroke-linecap="round"/><circle cx="245" cy="335" r="18" fill="#fff" stroke="#e77832" stroke-width="3"/><text x="245" y="341" font-family="Arial" text-anchor="middle" font-size="21" font-weight="700" fill="#e77832">±</text><path d="M650 500 L545 500" fill="none" stroke="#e77832" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="595" y="480" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#e77832">反馈</text><text x="905" y="255" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#66788b">环路增益</text><text x="905" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#2764a5">T = Aβ = 100 × 0.1 = 10</text><line x1="900" y1="350" x2="1260" y2="350" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><text x="905" y="415" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#66788b">闭环增益</text><text x="905" y="470" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#203247">Af = A/(1 + Aβ)</text><text x="905" y="520" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#16a6b7">= 100/11 ≈ 9.09</text><rect x="900" y="565" width="330" height="60" rx="12" fill="#eaf7f6" stroke="#bde7e2" stroke-width="2"/><text x="1065" y="603" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#16a6b7">深度反馈近似：1/β = 10</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>