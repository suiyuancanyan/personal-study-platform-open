rosoft YaHei',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#66788b">4</text><text x="205" y="275" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="500" text-anchor="end" fill="#66788b">4</text><text x="205" y="433" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="500" text-anchor="end" fill="#66788b">2</text><text x="205" y="590" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="500" text-anchor="end" fill="#66788b">0</text><text x="680" y="666" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142d4e">VCE (V)</text><text x="145" y="420" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142d4e">IC (mA)</text><text x="260" y="250" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2764a5">截止：VCE = VCC = 12 V</text><text x="860" y="570" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#2764a5">饱和方向：IC = VCC/RC = 4 mA</text><text x="710" y="410" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#e77832">Q (6 V, 2 mA)</text><text x="810" y="310" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#203247">VCE = 12 − 3 kΩ · IC</text><text x="810" y="350" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#66788b">Q 点：12 − (2 mA)(3 kΩ) = 6 V</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>