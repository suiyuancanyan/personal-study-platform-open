<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">差模取差值，共模取平均值</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">v₊ = 1.01 V，v₋ = 0.99 V；共同叠加相同电压时，差模保持不变</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="75" y="180" width="760" height="480" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><rect x="875" y="180" width="450" height="480" rx="18" fill="#f7fafc" stroke="#dce5ed" stroke-width="2"/><text x="455" y="235" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#142d4e">两路输入</text><line x1="180" y1="340" x2="730" y2="340" stroke="#2764a5" stroke-width="6" stroke-linecap="round"/><line x1="180" y1="470" x2="730" y2="470" stroke="#16a6b7" stroke-width="6" stroke-linecap="round"/><text x="180" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#2764a5">v₊ = 1.01 V</text><text x="180" y="510" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#16a6b7">v₋ = 0.99 V</text><line x1="285" y1="340" x2="285" y2="470" stroke="#e77832" stroke-width="4" stroke-linecap="round"/><path d="M270 355 L285 340 L300 355 M270 455 L285 470 L300 455" fill="none" stroke="#e77832" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="405" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#e77832">差值 20 mV</text><rect x="515" y="285" width="245" height="80" rx="12" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="638" y="320" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#142d4e">共同 +0.2 V</text><text x="638" y="348" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#66788b">两路同加</text><line x1="638" y1="365" x2="638" y2="340" stroke="#142d4e" stroke-width="2" stroke-linecap="round"/><rect x="515" y="420" width="245" height="80" rx="12" fill="#eaf7f6" stroke="#bde7e2" stroke-width="2"/><text x="638" y="455" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#142d4e">共同 +0.2 V</text><text x="638" y="483" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#66788b">两路同加</text><line x1="638" y1="420" x2="638" y2="470" stroke="#142d4e" stroke-width="2" stroke-linecap="round"/><text x="1100" y="250" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#66788b">差模电压</text><text x="1100" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#203247">vd = v₊ − v₋</text><text x="1100" y="350" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#2764a5">= 1.01 − 0.99</text><text x="1100" y="395" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#2764a5">= 20 mV</text><line x1="930" y1="425" x2="1270" y2="425" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><text x="1100" y="480" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#66788b">共模电压</text><text x="1100" y="525" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#203247">vcm = (v₊ + v₋)/2</text><text x="1100" y="570" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#16a6b7">= 1.00 V</text><rect x="960" y="600" width="280" height="42" rx="12" fill="#fff4ed" stroke="#f4d1bc" stroke-width="2"/><text x="1100" y="628" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#e77832">同加 0.2 V 后 vd 仍为 20 mV</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>