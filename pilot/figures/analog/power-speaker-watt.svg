<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">8 Ω 扬声器上的正弦电压功率</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">峰值电压 4 V；对正弦波，Vrms = Vp/√2，平均功率按 Vrms²/R 计算</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="70" y="180" width="730" height="480" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><rect x="850" y="180" width="480" height="480" rx="18" fill="#f7fafc" stroke="#dce5ed" stroke-width="2"/><text x="435" y="240" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#142d4e">负载电压</text><line x1="150" y1="430" x2="730" y2="430" stroke="#203247" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="570" x2="170" y2="290" stroke="#203247" stroke-width="3" stroke-linecap="round"/><path d="M170 430 C235 290 305 290 370 430 S505 570 570 430 S705 290 770 430" fill="none" stroke="#2764a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="370" y1="430" x2="370" y2="300" stroke="#e77832" stroke-width="2" stroke-linecap="round"/><text x="390" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#e77832">Vp = 4 V</text><text x="445" y="610" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#66788b">时间</text><rect x="900" y="270" width="365" height="90" rx="14" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="1082" y="310" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#2764a5">Vrms = 4/√2 V</text><text x="1082" y="343" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#142d4e">≈ 2.828 V</text><rect x="900" y="395" width="365" height="90" rx="14" fill="#eaf7f6" stroke="#bde7e2" stroke-width="2"/><text x="1082" y="435" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#16a6b7">P = Vrms² / R</text><text x="1082" y="468" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#142d4e">= 8 / 8 W</text><rect x="950" y="530" width="265" height="70" rx="14" fill="#fff4ed" stroke="#f4d1bc" stroke-width="2"/><text x="1082" y="575" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#e77832">平均功率 = 1 W</text><text x="900" y="625" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#66788b">阻值 R = 8 Ω</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>