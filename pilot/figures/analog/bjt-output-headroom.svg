<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">Q 点位置决定输出摆幅</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">静态输出 7 V；输出可在约 0.2 V 至 10 V 之间摆动，先由较近的边界限制</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="90" y="180" width="1220" height="490" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><line x1="220" y1="555" x2="1180" y2="555" stroke="#203247" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="555" x2="220" y2="275" stroke="#203247" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="300" x2="1180" y2="300" stroke="#d94a4a" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="555" x2="1180" y2="555" stroke="#d94a4a" stroke-width="3" stroke-linecap="round"/><line x1="390" y1="300" x2="390" y2="555" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><line x1="1010" y1="300" x2="1010" y2="555" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><path d="M250 430 C340 430 355 350 430 350 S535 430 610 430 S715 510 790 510 S895 430 970 430 S1075 350 1150 350" fill="none" stroke="#2764a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="220" y1="430" x2="1180" y2="430" stroke="#e77832" stroke-width="3" stroke-linecap="round"/><circle cx="700" cy="430" r="9" fill="#e77832"/><text x="220" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#d94a4a">10 V 最高输出边界</text><text x="220" y="590" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#d94a4a">0.2 V 最低输出边界</text><text x="720" y="415" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#e77832">静态 Q 点 = 7 V</text><line x1="700" y1="425" x2="700" y2="310" stroke="#e77832" stroke-width="2" stroke-linecap="round"/><line x1="700" y1="435" x2="700" y2="545" stroke="#e77832" stroke-width="2" stroke-linecap="round"/><text x="535" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#203247">向上余量：10 − 7 = 3 V</text><text x="535" y="510" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#203247">向下余量：7 − 0.2 = 6.8 V</text><rect x="875" y="205" width="340" height="65" rx="14" fill="#fff4ed" stroke="#f4d1bc" stroke-width="2"/><text x="1045" y="247" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#e77832">对称峰值上限 ≈ 3 V</text><text x="700" y="630" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle" fill="#66788b">时间 →</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>