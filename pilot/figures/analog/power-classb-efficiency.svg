<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">互补输出级的理想效率估算</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">±10 V 电源，8 Ω 负载，正弦输出峰值 8 V；峰值电流 1 A</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="70" y="175" width="720" height="500" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><rect x="835" y="175" width="495" height="500" rx="18" fill="#f7fafc" stroke="#dce5ed" stroke-width="2"/><text x="430" y="235" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#142d4e">互补推挽输出</text><line x1="430" y1="275" x2="430" y2="315" stroke="#203247" stroke-width="4" stroke-linecap="round"/><rect x="360" y="315" width="140" height="60" rx="10" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="430" y="353" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142d4e">+10 V</text><path d="M430 375 L430 410 M430 410 L400 435 L460 435 Z" fill="none" stroke="#2764a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="435" x2="430" y2="470" stroke="#203247" stroke-width="4" stroke-linecap="round"/><circle cx="430" cy="470" r="7" fill="#203247"/><line x1="430" y1="470" x2="430" y2="505" stroke="#203247" stroke-width="4" stroke-linecap="round"/><path d="M400 505 L460 505 L430 535 Z" fill="none" stroke="#16a6b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="535" x2="430" y2="575" stroke="#203247" stroke-width="4" stroke-linecap="round"/><rect x="360" y="575" width="140" height="60" rx="10" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="430" y="613" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142d4e">−10 V</text><line x1="430" y1="470" x2="610" y2="470" stroke="#203247" stroke-width="4" stroke-linecap="round"/><circle cx="610" cy="470" r="6" fill="#203247"/><line x1="610" y1="470" x2="610" y2="530" stroke="#203247" stroke-width="4" stroke-linecap="round"/><path d="M590 530 Q610 548 630 530 M590 550 Q610 568 630 550" fill="none" stroke="#e77832" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="610" y1="550" x2="610" y2="610" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="580" y1="610" x2="640" y2="610" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="590" y1="625" x2="630" y2="625" stroke="#203247" stroke-width="4" stroke-linecap="round"/><text x="650" y="490" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#2764a5">Vo,p = 8 V</text><text x="650" y="565" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#e77832">RL = 8 Ω</text><text x="120" y="635" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2764a5">Ip = Vp/RL = 8/8 = 1 A</text>
<text x="890" y="245" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#66788b">交流输出功率</text><text x="890" y="300" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#203247">Po = Vp²/(2RL)</text><text x="890" y="340" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#2764a5">= 64/16 = 4 W</text><line x1="890" y1="370" x2="1275" y2="370" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><text x="890" y="425" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#66788b">理想直流输入功率</text><text x="890" y="475" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#203247">Pdc = 2VCC·Ip/π</text><text x="890" y="515" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2764a5">= 20/π ≈ 6.37 W</text><line x1="890" y1="545" x2="1275" y2="545" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><rect x="890" y="575" width="350" height="64" rx="12" fill="#eaf7f6" stroke="#bde7e2" stroke-width="2"/><text x="1065" y="617" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#16a6b7">η ≈ 4/6.37 = 62.8%</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>