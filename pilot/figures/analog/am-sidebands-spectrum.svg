<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">单音 AM 的载波与上下边带</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">fc = 100 kHz、fm = 3 kHz；两条边带在载波两侧各 3 kHz，间距为 6 kHz</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="80" y="180" width="1240" height="490" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><line x1="190" y1="550" x2="1220" y2="550" stroke="#203247" stroke-width="3" stroke-linecap="round"/><line x1="190" y1="550" x2="190" y2="280" stroke="#203247" stroke-width="3" stroke-linecap="round"/><path d="M210 550 L210 530 L320 530 L320 550 M420 550 L420 530 L530 530 L530 550 M850 550 L850 530 L960 530 L960 550 M1060 550 L1060 530 L1170 530 L1170 550" fill="none" stroke="#dce5ed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="420" y1="530" x2="420" y2="305" stroke="#2764a5" stroke-width="6" stroke-linecap="round"/><line x1="850" y1="530" x2="850" y2="260" stroke="#e77832" stroke-width="6" stroke-linecap="round"/><line x1="1170" y1="530" x2="1170" y2="305" stroke="#2764a5" stroke-width="6" stroke-linecap="round"/><circle cx="420" cy="305" r="8" fill="#2764a5"/><circle cx="850" cy="260" r="8" fill="#e77832"/><circle cx="1170" cy="305" r="8" fill="#2764a5"/><text x="420" y="285" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2764a5">下边带</text><text x="850" y="235" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#e77832">载波</text><text x="1170" y="285" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#2764a5">上边带</text><text x="420" y="585" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2764a5">97 kHz</text><text x="850" y="585" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#e77832">100 kHz</text><text x="1170" y="585" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#2764a5">103 kHz</text><line x1="420" y1="620" x2="850" y2="620" stroke="#16a6b7" stroke-width="3" stroke-linecap="round"/><line x1="420" y1="610" x2="420" y2="630" stroke="#16a6b7" stroke-width="3" stroke-linecap="round"/><line x1="850" y1="610" x2="850" y2="630" stroke="#16a6b7" stroke-width="3" stroke-linecap="round"/><text x="635" y="655" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#16a6b7">fm = 3 kHz</text><line x1="850" y1="620" x2="1170" y2="620" stroke="#16a6b7" stroke-width="3" stroke-linecap="round"/><line x1="1170" y1="610" x2="1170" y2="630" stroke="#16a6b7" stroke-width="3" stroke-linecap="round"/><text x="1010" y="655" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#16a6b7">fm = 3 kHz</text><rect x="390" y="200" width="600" height="48" rx="12" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><text x="690" y="231" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#142d4e">总带宽 = (fc + fm) − (fc − fm) = 2fm = 6 kHz</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>