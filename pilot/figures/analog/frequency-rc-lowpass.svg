<text x="720" y="230" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#66788b">幅频响应</text><line x1="760" y1="575" x2="1250" y2="575" stroke="#203247" stroke-width="3" stroke-linecap="round"/><line x1="760" y1="575" x2="760" y2="290" stroke="#203247" stroke-width="3" stroke-linecap="round"/><path d="M775 320 C870 321 910 323 955 335 C1040 365 1050 445 1100 480 C1150 520 1200 540 1245 548" fill="none" stroke="#2764a5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="760" y1="320" x2="1250" y2="320" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><circle cx="1000" cy="350" r="8" fill="#e77832"/><line x1="1000" y1="350" x2="1000" y2="575" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><line x1="760" y1="350" x2="1000" y2="350" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><text x="755" y="305" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="500" text-anchor="end" fill="#66788b">1</text><text x="748" y="357" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" text-anchor="end" fill="#e77832">0.707</text><text x="1000" y="610" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#e77832">fc ≈ 1.59 kHz</text><text x="1250" y="610" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="500" text-anchor="end" fill="#66788b">f (对数刻度)</text><text x="720" y="665" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#16a6b7">fc = 1 / (2π × 1 kΩ × 100 nF) ≈ 1.59 kHz</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>