<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="30" fill="#fff"/><rect x="0" y="0" width="1400" height="14" fill="#16a6b7"/><text x="72" y="88" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#142d4e">稳压管并联负载的电流分配</text><text x="72" y="130" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#66788b">9 V 输入经 1 kΩ 限流，5 V 稳压管与负载并联；负载电流为 2 mA</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2764a5"/></marker><marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e77832"/></marker></defs><rect x="72" y="175" width="1256" height="510" rx="18" fill="#f3f7fa" stroke="#dce5ed" stroke-width="2"/><line x1="185" y1="400" x2="310" y2="400" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="310" y1="400" x2="375" y2="400" stroke="#203247" stroke-width="4" stroke-linecap="round"/><path d="M375 350 l-18 12 36 18 -36 18 36 18 -18 12" fill="none" stroke="#e77832" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="330" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#142d4e">1 kΩ</text><line x1="410" y1="400" x2="560" y2="400" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="560" y1="280" x2="560" y2="585" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="560" y1="280" x2="950" y2="280" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="560" y1="585" x2="950" y2="585" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="950" y1="280" x2="950" y2="585" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="950" y1="400" x2="1120" y2="400" stroke="#203247" stroke-width="4" stroke-linecap="round"/>
<rect x="185" y="365" width="125" height="70" rx="12" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="247" y="410" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#142d4e">9 V</text>
<path d="M520 465 L560 400 L600 465 Z" fill="#fff4ed" stroke="#e77832" stroke-width="4"/><line x1="520" y1="477" x2="600" y2="477" stroke="#e77832" stroke-width="5"/><path d="M510 488 l10 -10 M600 466 l10 -10" stroke="#e77832" stroke-width="4"/><text x="560" y="525" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#e77832">5 V Zener</text>
<rect x="850" y="350" width="200" height="100" rx="12" fill="#eef4fb" stroke="#bfd0e2" stroke-width="2"/><text x="950" y="392" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#142d4e">负载</text><text x="950" y="425" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#142d4e">IL = 2 mA</text><line x1="1120" y1="400" x2="1120" y2="585" stroke="#203247" stroke-width="4" stroke-linecap="round"/><line x1="1120" y1="585" x2="560" y2="585" stroke="#203247" stroke-width="4" stroke-linecap="round"/><text x="185" y="330" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#66788b">输入</text><text x="1090" y="370" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#2764a5">输出 = 5 V</text><text x="630" y="335" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#2764a5">IR = (9−5)/1 kΩ = 4 mA</text><text x="650" y="520" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#16a6b7">IZ = IR − IL = 4 − 2 = 2 mA</text><text x="180" y="642" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#203247">电流方向：限流电阻电流在输出节点分成负载电流与稳压管电流。</text><text x="72" y="775" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#8998a7">模拟电子技术 · 例题图解</text></svg>